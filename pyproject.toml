[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-agent-runtime"
version = "0.0.1"
description = "Single-agent runtime with tau-bench evaluation and traceable execution"
requires-python = ">=3.12"
dependencies = ["litellm==1.105.1", "pydantic", "pytest", "httpx", "python-dotenv", "fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools]
packages = ["m0", "runtime", "domains", "domains.tau", "eval", "scripts", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
